
name: Compilar IPA iPhone gratis (sin firmar)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar configuracion Swift
        run: python3 scripts/generate_presets.py

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar app para iPhone
        run: |
          xcodebuild \
            -project GolfWidgets.xcodeproj \
            -scheme GolfWidgets \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Crear IPA sin firmar
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Release-iphoneos/GolfWidgets.app"
          test -d "$APP"
          test -d "$APP/PlugIns/GolfWidgetsWidget.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/GolfWidgets.app
          /usr/bin/zip -qry GolfWidgetsGratis.ipa Payload
          unzip -l GolfWidgetsGratis.ipa | grep 'GolfWidgetsWidget.appex'

      - name: Descargar IPA desde Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GolfWidgetsGratis-IPA
          path: GolfWidgetsGratis.ipa
          if-no-files-found: error
